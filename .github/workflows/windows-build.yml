name: Windows MSI build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install WiX Toolset CLI
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build Windows app and MSI
        shell: pwsh
        run: .\windows\build-windows.ps1

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: samenwijs-windows-msi
          path: windows/artifacts/SAMENWIJS-Setup.msi
          if-no-files-found: error
          retention-days: 14
